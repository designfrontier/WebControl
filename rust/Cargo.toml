[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"
nalgebra = "0.33"
regex = "1"
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
rppal = "0.22"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-serial = { version = "5", default-features = false }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
wc-calibration = { path = "crates/wc-calibration" }
wc-config = { path = "crates/wc-config" }
wc-firmware = { path = "crates/wc-firmware" }
wc-gcode = { path = "crates/wc-gcode" }
wc-kinematics = { path = "crates/wc-kinematics" }
wc-machine = { path = "crates/wc-machine" }
wc-optical = { path = "crates/wc-optical" }
wc-protocol = { path = "crates/wc-protocol" }
wc-sim = { path = "crates/wc-sim" }
wc-testkit = { path = "crates/wc-testkit" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
