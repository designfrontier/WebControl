[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
jsonschema = { version = "0.61", default-features = false }
regex = "1"
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wc-config = { path = "crates/wc-config" }
wc-gcode = { path = "crates/wc-gcode" }
wc-machine = { path = "crates/wc-machine" }
wc-protocol = { path = "crates/wc-protocol" }
wc-testkit = { path = "crates/wc-testkit" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
