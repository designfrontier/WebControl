[package]
name = "wc-sim"
description = "A model of the Maslow firmware's serial behaviour (not its motion), for tests, e2e and --simulate"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util"] }
wc-firmware.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
