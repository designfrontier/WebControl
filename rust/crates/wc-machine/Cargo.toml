[package]
name = "wc-machine"
description = "The machine core: the only writer of job, link and firmware state, plus the tokio shell around it"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
wc-calibration.workspace = true
wc-config.workspace = true
wc-firmware.workspace = true
wc-gcode.workspace = true
wc-kinematics.workspace = true
wc-protocol.workspace = true

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
wc-sim.workspace = true
wc-testkit.workspace = true
