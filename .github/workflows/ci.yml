name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    name: Holey 51.292 hex from the v51.292 tag, checked against its pin
    # The compiler's output differs between build hosts, and the pinned digest was made on linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bash rust/firmware/docker-build.sh "$RUNNER_TEMP/firmware"
      - uses: actions/upload-artifact@v7
        with:
          name: holey-51.292-hex
          path: ${{ runner.temp }}/firmware/holey-51.292.hex
          retention-days: 14

  rust:
    name: Rust test, coverage, aarch64 build and e2e smoke
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-
      # rust-toolchain.toml names the toolchain, its components and the aarch64 target.
      - run: rustup toolchain install
      - name: Install zig, cargo-zigbuild and cargo-llvm-cov
        run: |
          python3 -m venv "$HOME/zig"
          "$HOME/zig/bin/pip" install ziglang
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Coverage, 95% lines for every crate
        run: scripts/coverage.sh
      - run: bash deploy/test.sh
      - run: bash scripts/release-test.sh
      - uses: actions/download-artifact@v8
        with:
          name: holey-51.292-hex
          path: ${{ runner.temp }}/firmware
      - name: Cross-build for the Pi (aarch64, glibc 2.36), with the pinned firmware embedded
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.36 -p wc-server
        env:
          WC_FIRMWARE_HEX: ${{ runner.temp }}/firmware/holey-51.292.hex
      - uses: actions/upload-artifact@v7
        with:
          name: webcontrol-rs-aarch64
          path: rust/target/aarch64-unknown-linux-gnu/release/webcontrol-rs
          retention-days: 14
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-rust
          path: frontend/test-results
          retention-days: 7
