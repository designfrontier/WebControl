name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    name: Holey 51.292 hex from the v51.292 tag, checked against its pin
    # The compiler's output differs between build hosts, and the pinned digest was made on linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bash rust/firmware/docker-build.sh "$RUNNER_TEMP/firmware"
      - uses: actions/upload-artifact@v7
        with:
          name: holey-51.292-hex
          path: ${{ runner.temp }}/firmware/holey-51.292.hex
          retention-days: 14

  rust:
    name: Rust format, lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      # rust-toolchain.toml names the toolchain, its components and the aarch64 target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs every workspace test once, under coverage.
      - name: Tests and coverage, 95% lines for every crate
        run: scripts/coverage.sh

  pi:
    name: Install scripts and the aarch64 and x86_64 builds
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: bash deploy/test.sh
      - run: bash deploy/update-test.sh
      - run: bash scripts/release-test.sh
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: pi
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m venv "$HOME/zig"
          "$HOME/zig/bin/pip" install ziglang
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: actions/download-artifact@v8
        with:
          name: holey-51.292-hex
          path: ${{ runner.temp }}/firmware
      - name: Cross-build for the Pi (aarch64, glibc 2.36), with the pinned firmware embedded
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.36 -p wc-server
        env:
          WC_FIRMWARE_HEX: ${{ runner.temp }}/firmware/holey-51.292.hex
      - name: Cross-build for x86_64 Linux laptops (glibc 2.36), with the pinned firmware embedded
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.36 -p wc-server
        env:
          WC_FIRMWARE_HEX: ${{ runner.temp }}/firmware/holey-51.292.hex
      - uses: actions/upload-artifact@v7
        with:
          name: webcontrol-rs-aarch64
          path: rust/target/aarch64-unknown-linux-gnu/release/webcontrol-rs
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: webcontrol-rs-x86_64
          path: rust/target/x86_64-unknown-linux-gnu/release/webcontrol-rs
          retention-days: 14

  e2e:
    name: Playwright against webcontrol-rs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: npx playwright install --with-deps chromium
      # The Playwright config builds the app and webcontrol-rs before serving them.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-rust
          path: frontend/test-results
          retention-days: 7
