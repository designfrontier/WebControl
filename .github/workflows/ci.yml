name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # opencv-python (not headless) needs libGL at import time.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.9"
      - run: uv venv --python 3.9 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python -m pytest --cov=api --cov=next_ui --cov-report=term-missing

  package:
    name: PyInstaller onedir smoke (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.9"
      - run: uv venv --python 3.9 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-build.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: tools/build_release.sh --skip-firmware
        env:
          PYTHON: .venv/bin/python
          PLATFORM: linux
      - name: Packaged app serves / and /next/
        run: |
          mkdir -p smoke/app smoke/home/.WebControl
          tar -C smoke/app -xzf releases/webcontrol-*-linux-singledirectory.tar.gz
          jq '(.["WebControl Settings"][] | select(.key == "webPort") | .value) = 5099' defaultwebcontrol.json \
            > smoke/home/.WebControl/webcontrol.json
          (cd smoke/app && HOME="$GITHUB_WORKSPACE/smoke/home" BROWSER=true ./webcontrol > ../app.log 2>&1 &)
          for _ in $(seq 90); do curl -fsS -o smoke/next.html http://localhost:5099/next/ && break; sleep 1; done
          grep -q 'id="root"' smoke/next.html
          curl -fsS -o /dev/null http://localhost:5099/
          curl -fsS -o /dev/null http://localhost:5099/api/state
      - if: failure()
        run: cat smoke/app.log || true

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.9"
      - run: uv venv --python 3.9 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  rust:
    name: Rust test, coverage, aarch64 build and e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-
      # rust-toolchain.toml names the toolchain, its components and the aarch64 target.
      - run: rustup toolchain install
      - name: Install zig, cargo-zigbuild and cargo-llvm-cov
        run: |
          python3 -m venv "$HOME/zig"
          "$HOME/zig/bin/pip" install ziglang
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Coverage, 95% lines for every crate
        run: scripts/coverage.sh
      - run: bash deploy/test.sh
      - name: Cross-build for the Pi (aarch64, glibc 2.36)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.36 -p wc-server
      - uses: actions/upload-artifact@v7
        with:
          name: webcontrol-rs-aarch64
          path: rust/target/aarch64-unknown-linux-gnu/release/webcontrol-rs
          retention-days: 14
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BACKEND: rust
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-rust
          path: frontend/test-results
          retention-days: 7
